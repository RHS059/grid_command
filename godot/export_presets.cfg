[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Global geographic warm-cache data is read with FileAccess at runtime. Keep the
; manifest, binary tiles, and bundled CA material in both desktop and patch PCKs.
include_filter="data/**/*.json,data/**/*.bin,data/**/*.pem,data/certificates/LICENSE-MPL-2.0.txt,assets/fonts/*-OFL.txt"
exclude_filter="*-preview.png,hud-preview.png"
export_path="build/windows/GridCommand.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
